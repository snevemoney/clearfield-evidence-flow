project_id = "sijocrtrjpbkwjbihgok"

# User-invoked functions: gateway JWT required. Handlers also call auth.getUser().
[functions.globe-query]
verify_jwt = true

[functions.rabbit-hole]
verify_jwt = true

[functions.bridge-import]
verify_jwt = true

[functions.find-contradictions]
verify_jwt = true

[functions.seed-document-archive]
verify_jwt = true

# Cron / batch jobs: gateway JWT off so a documented CRON_SECRET can be sent
# as x-cron-secret. Handlers fail closed if neither a valid user JWT nor a
# matching CRON_SECRET is present. Set CRON_SECRET in the function secrets.
[functions.ingest-news]
verify_jwt = false

[functions.ingest-twitter]
verify_jwt = false

[functions.ingest-documents]
verify_jwt = false

[functions.process-intelligence]
verify_jwt = false

[functions.fact-check]
verify_jwt = false
